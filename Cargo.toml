[workspace]
resolver = "2"
members = ["crates/core", "crates/data", "crates/proto", "crates/modules", "app/src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
strip = true
