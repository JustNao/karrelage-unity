[workspace]
resolver = "2"
members = ["crates/core", "crates/data", "crates/proto", "crates/modules", "app/src-tauri"]

[workspace.package]
version = "1.8.1"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
strip = true

# style lints the code base deliberately does not follow (CI runs clippy with -D warnings)
[workspace.lints.clippy]
type_complexity = "allow"
nonminimal_bool = "allow"
result_unit_err = "allow"
should_implement_trait = "allow"
