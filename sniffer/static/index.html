<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loutil Packets</title>
<style>
:root{--bg:#14161a;--panel:#1c1f26;--line:#2a2e38;--fg:#d8dce4;--mut:#8a91a0;--acc:#5aa9ff;--ok:#4cc38a;--warn:#e0b04a;--bad:#e5646e;--c2s:#c792ea;--s2c:#7fd1b9}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f8;--panel:#fff;--line:#dde0e6;--fg:#1d2128;--mut:#6a7280;--acc:#1f6fd1;--ok:#17915a;--warn:#a87414;--bad:#c4343f;--c2s:#8a3fb8;--s2c:#12806a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,Consolas,monospace;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font:600 14px system-ui;margin:0;margin-right:6px}
.sw{position:relative;width:44px;height:24px;background:var(--line);border-radius:12px;cursor:pointer;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.lbl{font-weight:600}
input,select,button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}
input[type=search]{width:220px}
.mut{color:var(--mut)}
main{flex:1;display:grid;grid-template-columns:160px 1fr 36%;min-height:0}
main.hasfmt{grid-template-columns:160px 1fr 30% 28%}
#fmt{display:none;background:var(--panel);overflow:auto;border-left:1px solid var(--line);padding:10px;font-family:system-ui,sans-serif;font-size:13px}
main.hasfmt #fmt{display:block}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;background:var(--bg)}
.card h4{margin:0 0 2px;font-size:13px}.card .sub{color:var(--mut);font-size:12px}
.prices{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pr{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}.pr b{color:var(--ok)}.pr.no{opacity:.4}
.eff{margin:0;padding-left:16px}.eff li.unk{color:var(--warn)}
.fh{font-weight:600;font-size:14px;margin-bottom:8px}
.eff li.added{color:var(--acc);font-weight:700}.eff li.above{color:var(--ok);font-weight:700}.eff li.removed{color:var(--mut);opacity:.55}
.eff li small{font-weight:400;color:var(--mut);margin-left:6px}
.shield{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn);font-size:12px}
.tabs{display:flex;gap:2px}.tab{padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--mut)}.tab.on{background:var(--bg);color:var(--fg);font-weight:600;outline:1px solid var(--line)}
#itemsView{display:none;flex:1;min-height:0;grid-template-columns:280px 1fr 320px}
#itemsView #ilist{overflow:auto;background:var(--panel);border-right:1px solid var(--line)}
#itemsView #ilist div{padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-family:system-ui,sans-serif}
#itemsView #ilist div:hover{background:var(--bg)}#itemsView #ilist div.sel{outline:1px solid var(--acc)}
#itemsView #idetail{overflow:auto;padding:12px;font-family:system-ui,sans-serif;font-size:13px}
#ihead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}#ihead .fh{margin:0;flex:1}
#ifilter{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:10px;font-family:system-ui,sans-serif;font-size:12px}
#ifilter .btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.frow{display:grid;grid-template-columns:1fr 54px 54px;gap:4px;align-items:center;margin:3px 0}
.frow input{width:100%;padding:2px 4px}.frow .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow .lb small{color:var(--mut)}
.frow.on .lb{font-weight:700;color:var(--acc)}
.card.col{cursor:pointer}.card .chev{float:right;color:var(--mut)}
.card .none{color:var(--mut);font-size:12px}
body.items main{display:none}body.items #itemsView{display:grid}body.items .pktctl{display:none!important}
.jk.ed{cursor:pointer;border-bottom:1px dotted var(--mut)}.jk.ed:hover{background:color-mix(in srgb,var(--acc) 20%,transparent)}
.jk.man{color:var(--ok)}input.ren{font:inherit;width:240px}
@media (max-width:900px){main,main.hasfmt{grid-template-columns:1fr}#types,#detail,#fmt{display:none}}
#types,#detail{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
#detail{border-right:0;border-left:1px solid var(--line);padding:10px}
#types div{padding:3px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line)}
#types div:hover{background:var(--bg)}#types div.sel{outline:1px solid var(--acc)}#types div.hid{opacity:.35;text-decoration:line-through}
#types span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list{overflow:auto;position:relative}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;border-bottom:1px solid var(--line)}
td.t{width:84px;color:var(--mut);max-width:none}td.d{width:44px;max-width:none}td.k{width:64px;color:var(--mut);max-width:none}td.n{width:190px;max-width:none}
tr{cursor:pointer}tr:hover{background:var(--panel)}tr.sel{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.c2s{color:var(--c2s)}.s2c{color:var(--s2c)}
.badge{font-size:10px;padding:0 5px;border-radius:8px;margin-left:6px;border:1px solid}
.high{color:var(--ok)}.med{color:var(--warn)}.manual{color:var(--acc)}.none{color:var(--mut)}
pre{margin:0;white-space:pre-wrap;word-break:break-all}
.jk{color:var(--acc)}.js{color:var(--ok)}.jn{color:var(--warn)}
h3{font:600 12px system-ui;margin:12px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
#bar{position:fixed;right:12px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:none}
</style>
</head>
<body>
<header>
  <h1>Loutil</h1>
  <div class="tabs"><div class="tab on" id="tabP">Packets</div><div class="tab" id="tabI">Items <span id="icnt" class="mut"></span></div></div>
  <div id="sw" class="sw" title="Toggle capture" role="switch" tabindex="0"></div>
  <span id="state" class="lbl">OFF</span>
  <span id="track" class="mut"></span>
  <span style="flex:1"></span>
  <span class="pktctl" style="display:contents"><input id="q" type="search" placeholder="filter (name, field, value)…">
  <select id="fdir"><option value="">both dirs</option><option>C->S</option><option>S->C</option></select>
  <select id="fkind"><option value="">all kinds</option><option>event</option><option>request</option><option>response</option></select>
  <label><input id="auto" type="checkbox" checked> follow</label>
  <button id="clear">Clear</button>
  <button id="reload" title="Reload work/mapping.json">Reload map</button>
  <span id="cnt" class="mut"></span></span>
</header>
<main>
  <div id="types"></div>
  <div id="list"><table><tbody id="rows"></tbody></table></div>
  <div id="fmt"></div>
  <div id="detail"><span class="mut">Select a packet.</span></div>
</main>
<section id="itemsView"><div id="ilist"></div><div id="idetail"><span class="mut">Items appear here automatically once an auction house packet is captured (latest packet per item wins).</span></div><div id="ifilter"></div></section>
<script>
const $=s=>document.querySelector(s);
const MAXROWS=2000;
let packets=[], byId=new Map(), typeStats=new Map(), hidden=new Set(), onlyType=null, sel=null, on=false;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtT=t=>{const d=new Date(t*1000);return d.toTimeString().slice(0,8)+'.'+String(d.getMilliseconds()).padStart(3,'0')};
const nm=p=>p.name||p.type||'?';

function summary(p){
  if(p.fmt&&p.fmt.kind==='auction_items'){const f=p.fmt;const mins=f.rows.map(r=>(r.prices[0]||{}).price).filter(x=>x>0);return `${f.title||'?'} · ${f.rows.length} lots`+(mins.length?` · min ${Math.min(...mins).toLocaleString('fr-FR')} kamas`:'')}
  const o=p.decoded||p.body||p.unparsed; if(o==null)return'';
  let s=JSON.stringify(o,(k,v)=>k.startsWith('__')?undefined:v); return s.length>300?s.slice(0,300)+'…':s;
}
function passes(p){
  if(hidden.has(nm(p)))return false;
  if(onlyType&&nm(p)!==onlyType)return false;
  const d=$('#fdir').value; if(d&&p.dir!==d)return false;
  const k=$('#fkind').value; if(k&&p.kind!==k)return false;
  const q=$('#q').value.trim().toLowerCase();
  if(q&&!(nm(p)+' '+(p.type||'')+' '+summary(p)).toLowerCase().includes(q))return false;
  return true;
}
function rowHtml(p){
  const conf=p.conf||'none';
  return `<tr data-id="${p.id}" class="${sel===p.id?'sel':''}"><td class="t">${fmtT(p.t)}</td><td class="d ${p.dir==='C->S'?'c2s':'s2c'}">${p.dir==='C->S'?'→ S':'← S'}</td><td class="k">${p.kind||''}</td><td class="n">${esc(nm(p))}${p.name&&p.type&&p.name!==p.type?`<span class="badge ${conf}" title="obfuscated: ${p.type}">${p.type} · ${conf}</span>`:''}</td><td>${esc(summary(p))}</td></tr>`;
}
function addPacket(p){
  packets.push(p); byId.set(p.id,p);
  const k=nm(p); typeStats.set(k,(typeStats.get(k)||0)+1);
  if(packets.length>MAXROWS*2){const old=packets.splice(0,MAXROWS);old.forEach(x=>byId.delete(x.id))}
}
let dirty=false;
function schedule(){if(!dirty){dirty=true;requestAnimationFrame(render)}}
function render(){
  dirty=false;
  const vis=packets.filter(passes).slice(-MAXROWS);
  $('#rows').innerHTML=vis.map(rowHtml).join('');
  $('#cnt').textContent=`${vis.length} shown / ${packets.length} buffered`;
  if($('#auto').checked){const l=$('#list');l.scrollTop=l.scrollHeight}
  const t=[...typeStats].sort((a,b)=>b[1]-a[1]);
  $('#types').innerHTML=t.map(([k,c])=>`<div data-k="${esc(k)}" class="${hidden.has(k)?'hid':''} ${onlyType===k?'sel':''}" title="click: only this · shift-click: hide"><span>${esc(k)}</span><span class="mut">${c}</span></div>`).join('');
}
$('#types').addEventListener('click',e=>{
  const d=e.target.closest('[data-k]'); if(!d)return; const k=d.dataset.k;
  if(e.shiftKey){hidden.has(k)?hidden.delete(k):hidden.add(k)} else {onlyType=onlyType===k?null:k}
  render();
});
function jhtml(v,ind=0){
  const pad='  '.repeat(ind);
  if(v===null)return'<span class="jn">null</span>';
  if(Array.isArray(v)){if(!v.length)return'[]';if(v.every(x=>typeof x!=='object'))return'['+v.map(x=>jhtml(x)).join(', ')+']';
    return'[\n'+v.map(x=>pad+'  '+jhtml(x,ind+1)).join(',\n')+'\n'+pad+']'}
  if(typeof v==='object'){const k=Object.keys(v).filter(x=>!x.startsWith('__'));if(!k.length)return'{}';
    const t=v.__t,fm=v.__f||{};
    return'{\n'+k.map(x=>{const ed=t&&fm[x];
      const cls=ed?('jk ed'+(/\(.*\?\)$/.test(x)||x===fm[x]?'':' man')):'jk';
      return `${pad}  <span class="${cls}"${ed?` data-t="${esc(t)}" data-f="${esc(fm[x])}" data-l="${esc(x)}" title="click to name this field (${esc(fm[x])})"`:''}>${esc(x)}</span>: ${jhtml(v[x],ind+1)}`}).join(',\n')+'\n'+pad+'}'}
  if(typeof v==='string')return`<span class="js">"${esc(v)}"</span>`;
  return`<span class="jn">${v}</span>`;
}
const kfmt=n=>Number(n).toLocaleString('fr-FR');
const effLi=e=>`<li class="${e.status||''} ${e.known?'':'unk'}" title="effect ${e.action}${e.range?' · default '+e.range[0]+'–'+e.range[1]:''}${e.status==='added'?' · added (not a default effect)':e.status==='above'?' · above default max':e.status==='removed'?' · removed (default effect missing)':''}">${esc(e.text)}${e.range&&e.status!=='removed'?`<small>[${e.range[0]}–${e.range[1]}]</small>`:''}</li>`;
function cardsHtml(rows,opt){
  opt=opt||{};
  return rows.map(r=>{
    const open=!opt.collapsible||opt.open(r);
    const shown=open?r.effects:r.effects.filter(e=>e.status==='added'||e.status==='above');
    return `<div class="card${opt.collapsible?' col':''}" data-uid="${r.uid}"><h4>${opt.collapsible?`<span class="chev">${open?'▾':'▸'}</span>`:''}${esc(r.name)} <span class="mut">${r.level!=null?'niv. '+r.level:''}</span>${r.locked?'<span class="shield" title="Empêche les futures forgemagies — cannot be modified anymore">🛡 Transcendance</span>':''}</h4>
      <div class="sub">${esc(r.type||'')} · uid ${r.uid??'?'}${r.gid==null?' · unresolved ints '+JSON.stringify(r.ints):''}${r.meta&&r.meta.crafted_by?' · fabriqué par '+esc(r.meta.crafted_by):''}${r.meta&&r.meta.modified_by?' · modifié par '+esc(r.meta.modified_by):''}</div>
      <div class="prices">${r.prices.map(p=>`<span class="pr ${p.price>0?'':'no'}">×${p.qty} <b>${p.price>0?kfmt(p.price)+' kamas':'—'}</b></span>`).join('')}</div>
      ${shown.length?`<ul class="eff">${shown.map(effLi).join('')}</ul>`:(open?'<div class="none">no effects</div>':'')}</div>`}).join('');
}
function fmtHtml(f){
  if(!f)return'';
  if(f.kind==='error')return`<div class="card">formatter error: ${esc(f.error)}</div>`;
  if(f.kind==='auction_items')return`<div class="fh">${esc(f.title||'(unknown item)')} <span class="mut">${esc(f.type||'')}${f.gid?' · gid '+f.gid:''}</span></div>`+
    (f.rows.length?cardsHtml(f.rows):'<div class="mut">no lots</div>');
  return'<pre>'+jhtml(f)+'</pre>';
}
function showDetail(p){
  sel=p.id;
  $('#fmt').innerHTML=fmtHtml(p.fmt);document.querySelector('main').classList.toggle('hasfmt',!!p.fmt);
  const hexs=(p.hex||'').replace(/(..)/g,'$1 ');
  const mt=p.decoded&&p.decoded.__t;
  $('#detail').innerHTML=`<div><b ${mt?`class="ed" id="mname" data-t="${esc(mt)}" style="cursor:pointer;border-bottom:1px dotted var(--mut)" title="click to rename this message"`:''}>${esc(nm(p))}</b> <span class="mut">${p.type&&p.type!==p.name?'('+p.type+')':''}</span></div>
  <div class="mut">${p.dir} · ${p.kind||'?'} · uid ${p.uid??'-'} · ${p.len} bytes · ${p.srv}${p.conf?' · match: '+p.conf:''}</div>
  <h3>${p.decoded?'Decoded (beta-mapped names; “a (x|y?)” = ambiguous candidates)':'Schemaless'}</h3>
  <pre>${jhtml(p.decoded||p.body||p.unparsed)}</pre>
  <h3>Raw hex</h3><pre class="mut">${hexs}</pre>`;
  document.querySelectorAll('#rows tr.sel').forEach(r=>r.classList.remove('sel'));
  const r=document.querySelector(`#rows tr[data-id="${p.id}"]`); if(r)r.classList.add('sel');
}
$('#rows').addEventListener('click',e=>{const tr=e.target.closest('tr');if(tr)showDetail(byId.get(+tr.dataset.id))});
['q','fdir','fkind'].forEach(i=>$('#'+i).addEventListener('input',render));
$('#clear').onclick=async()=>{await fetch('/api/clear',{method:'POST'});packets=[];byId.clear();typeStats.clear();render()};
$('#reload').onclick=()=>fetch('/api/reload',{method:'POST'});
async function setOn(v){const r=await fetch('/api/capture',{method:'POST',body:JSON.stringify({on:v})});setStatus(await r.json())}
function setStatus(s){
  on=s.on;$('#sw').classList.toggle('on',on);
  $('#state').textContent=on?'ON':'OFF';$('#state').style.color=on?'var(--ok)':'var(--mut)';
  $('#track').textContent=on?(s.tracking.length?'tracking '+s.tracking.join(', '):'waiting for Dofus.exe connections…'):'';
}
$('#sw').onclick=()=>setOn(!on);
$('#sw').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setOn(!on)}};
// ---- tabs + items store
let items=new Map(), selItem=null;
function setTab(t){document.body.classList.toggle('items',t==='items');$('#tabP').classList.toggle('on',t!=='items');$('#tabI').classList.toggle('on',t==='items')}
$('#tabP').onclick=()=>setTab('packets');$('#tabI').onclick=()=>setTab('items');
const ago=t=>{const d=Math.round(Date.now()/1000-t);return d<60?d+'s':d<3600?Math.round(d/60)+'min':Math.round(d/3600)+'h'};
let allEffects=[], effById=new Map(), openSet=new Set(), allOpen=false, sortDir=1;
const filters=new Map();   // gid -> [{a,min,max}]
const unitPrice=r=>{const v=r.prices.filter(p=>p.price>0).map(p=>p.price/p.qty);return v.length?Math.min(...v):Infinity};
const effLabel=a=>(effById.get(a)||{}).label||('effect '+a);
const lotVal=(r,a)=>Math.max(0,...r.effects.filter(e=>e.action===a&&e.status!=='removed').map(e=>e.hi??0));
function filterRows(i){
  // all effects of the item: defaults first, then any seen in the lots, then manually added ones
  const seen=new Map();
  for(const d of i.defaults||[])seen.set(d.a,{a:d.a,def:[d.min,d.max]});
  for(const r of i.rows)for(const e of r.effects)if(e.status!=='removed'&&!seen.has(e.action))seen.set(e.action,{a:e.action,def:e.range||null});
  const f=filters.get(i.gid)||[];
  for(const x of f)if(!seen.has(x.a))seen.set(x.a,{a:x.a,def:null,extra:true});
  return [...seen.values()];
}
function getF(i,a){let f=filters.get(i.gid);if(!f){f=[];filters.set(i.gid,f)}let x=f.find(y=>y.a===a);if(!x){x={a,min:'',max:''};f.push(x)}return x}
function observed(i,a){const v=i.rows.map(r=>lotVal(r,a)).filter(x=>x>0);return v.length?[Math.min(...v),Math.max(...v)]:null}
function renderFilter(i){
  const rows=filterRows(i),f=filters.get(i.gid)||[];
  const active=x=>{const y=f.find(z=>z.a===x.a);return y&&(y.min!==''||y.max!=='')};
  $('#ifilter').innerHTML=`<div class="fh">Filter effects</div>
  <div class="btns"><button data-p="min" title="min = lowest value of each effect's default range">Min values</button><button data-p="damage" title="perfect (default max) for damage effects">Damage</button><button data-p="resist" title="perfect (default max) for % resistances">Résistances</button><button data-p="clear">Clear</button></div>
  <div class="btns"><input id="freeEff" list="effList" placeholder="add any effect…" style="flex:1;min-width:0"><button data-p="add">Add</button></div>
  <datalist id="effList">${allEffects.map(e=>`<option value="${esc(e.label)} #${e.id}">`).join('')}</datalist>
  ${rows.map(x=>{const y=f.find(z=>z.a===x.a)||{min:'',max:''};return `<div class="frow ${active(x)?'on':''}" data-a="${x.a}"><div class="lb" title="effect ${x.a}">${esc(effLabel(x.a))}${x.def?` <small>[${x.def[0]}–${x.def[1]}]</small>`:''}</div><input type="number" data-k="min" placeholder="min" value="${y.min}"><input type="number" data-k="max" placeholder="max" value="${y.max}"></div>`}).join('')||'<div class="mut">no effects</div>'}`;
}
function applyFilter(i){
  const f=(filters.get(i.gid)||[]).filter(x=>x.min!==''||x.max!=='');
  let rows=i.rows.filter(r=>f.every(x=>{const v=lotVal(r,x.a);return (x.min===''||v>=+x.min)&&(x.max===''||v<=+x.max)}));
  return rows.sort((p,q)=>{const a=unitPrice(p),b=unitPrice(q);return a===b?0:a===Infinity?1:b===Infinity?-1:(a-b)*sortDir});
}
function renderItems(keepFilter){
  const l=[...items.values()].sort((a,b)=>b.updated-a.updated);
  $('#icnt').textContent=l.length?`(${l.length})`:'';
  $('#ilist').innerHTML=l.map(i=>`<div data-g="${i.gid}" class="${selItem===i.gid?'sel':''}"><b>${esc(i.name)}</b> <span class="mut">niv. ${i.level??'?'}</span><br><span class="mut">${esc(i.type||'')} · ${i.lots} lots · ${i.min_price?'min '+kfmt(i.min_price)+' kamas':'—'} · ${ago(i.updated)} ago${i.demo?' · demo':''}</span></div>`).join('')||'<div class="mut">empty</div>';
  const i=items.get(selItem);
  if(!i){$('#ifilter').innerHTML='';return}
  if(!keepFilter)renderFilter(i);
  const rows=applyFilter(i);
  $('#idetail').innerHTML=`<div id="ihead"><div class="fh">${esc(i.name)} <span class="mut">${esc(i.type||'')} · gid ${i.gid} · updated ${ago(i.updated)} ago · ${rows.length}/${i.lots} lots</span></div>
    <select id="isort"><option value="1" ${sortDir===1?'selected':''}>price ↑</option><option value="-1" ${sortDir===-1?'selected':''}>price ↓</option></select>
    <button id="itoggle">${allOpen?'Collapse all':'Expand all'}</button><button id="idel">forget all items</button></div>`+
    (rows.length?cardsHtml(rows,{collapsible:true,open:r=>allOpen||openSet.has(r.uid)}):'<div class="mut">no lot matches the filter</div>');
}
$('#ilist').addEventListener('click',e=>{const d=e.target.closest('[data-g]');if(d){selItem=+d.dataset.g;renderItems()}});
$('#idetail').addEventListener('click',async e=>{
  if(e.target.id==='idel'){if(confirm('Forget all stored items?')){await fetch('/api/items/clear',{method:'POST'});items.clear();selItem=null;renderItems();$('#idetail').textContent='cleared'}return}
  if(e.target.id==='itoggle'){allOpen=!allOpen;openSet.clear();renderItems(true);return}
  const c=e.target.closest('.card.col');if(c){const u=+c.dataset.uid;openSet.has(u)?openSet.delete(u):openSet.add(u);renderItems(true)}});
$('#idetail').addEventListener('change',e=>{if(e.target.id==='isort'){sortDir=+e.target.value;renderItems(true)}});
$('#ifilter').addEventListener('input',e=>{
  const row=e.target.closest('.frow');if(!row)return;const i=items.get(selItem);
  getF(i,+row.dataset.a)[e.target.dataset.k]=e.target.value;
  row.classList.toggle('on',(getF(i,+row.dataset.a).min!==''||getF(i,+row.dataset.a).max!==''));
  renderItems(true)});
$('#ifilter').addEventListener('click',e=>{
  const p=e.target.dataset&&e.target.dataset.p;if(!p)return;const i=items.get(selItem);if(!i)return;
  const rows=filterRows(i);
  if(p==='clear')filters.set(i.gid,[]);
  else if(p==='add'){const v=$('#freeEff').value;const m=v.match(/#(\d+)$/)||[];let a=+m[1];
    if(!a){const hit=allEffects.find(x=>x.label.toLowerCase()===v.trim().toLowerCase());a=hit&&hit.id}
    if(a)getF(i,a)}
  else for(const x of rows){
    if(!x.def)continue;   // presets only touch the item's default effects (perfect = default max)
    const g=(effById.get(x.a)||{}).group,y=getF(i,x.a);
    if(p==='min')y.min=x.def[0];
    else if(p===g)y.min=x.def[1]}
  renderItems()});
function putItem(i){items.set(i.gid,i);if(selItem===null)selItem=i.gid;renderItems(!!document.activeElement.closest('#ifilter'))}
// ---- editable decoded names
function walk(o,fn){if(Array.isArray(o))o.forEach(x=>walk(x,fn));else if(o&&typeof o==='object'){fn(o);Object.values(o).forEach(x=>walk(x,fn))}}
const candRe=/ \((.*)\?\)$/;
function applyRename(t,obf,name){
  for(const p of packets){if(!p.decoded)continue;walk(p.decoded,o=>{
    if(o.__t!==t||!o.__f)return;
    const ent=Object.entries(o).filter(([k])=>!k.startsWith('__')),nf={},nm2={};
    for(const [k,v] of ent){
      let key=k;const ob=o.__f[k];
      if(ob===obf)key=name||ob;
      else if(name&&candRe.test(k)){const m=k.match(candRe);const c=m[1].split('|').filter(x=>x!==name);key=ob+(c.length?` (${c.join('|')}?)`:'')}
      nf[key]=v;nm2[key]=ob}
    for(const k of Object.keys(o))delete o[k];
    Object.assign(o,nf);o.__t=t;o.__f=nm2})}
}
let editing=false;
function openEditor(el,t,obf,cur,cands,isMsg,pid){
  if(editing)return;editing=true;
  const inp=document.createElement('input');inp.className='ren';inp.value=cur;inp.placeholder=isMsg?'message name':obf;
  const dl=document.createElement('datalist');dl.id='dl'+Date.now();cands.forEach(c=>{const o=document.createElement('option');o.value=c;dl.appendChild(o)});
  inp.setAttribute('list',dl.id);el.replaceWith(inp);inp.after(dl);inp.focus();inp.select();
  const done=async ok=>{if(!editing)return;editing=false;const name=inp.value.trim();
    if(ok){await fetch('/api/rename',{method:'POST',body:JSON.stringify({msg:t,field:isMsg?null:obf,name})});
      if(isMsg){for(const p of packets)if(p.decoded&&p.decoded.__t===t){p.name=name||p.type}}else applyRename(t,obf,name)}
    const p=byId.get(pid);render();if(p)showDetail(p)};
  inp.onkeydown=e=>{if(e.key==='Enter')done(true);else if(e.key==='Escape')done(false)};
  inp.onblur=()=>done(false);
}
$('#detail').addEventListener('click',e=>{
  const k=e.target.closest('.jk.ed'),m=e.target.closest('#mname');
  if(k){const lab=k.dataset.l,mm=lab.match(candRe);
    const cands=mm?mm[1].split('|'):[];const cur=mm?'':lab;
    openEditor(k,k.dataset.t,k.dataset.f,cur===k.dataset.f?'':cur,cands,false,sel)}
  else if(m)openEditor(m,m.dataset.t,null,m.textContent===m.dataset.t?'':m.textContent,[],true,sel);
});
(async()=>{
  allEffects=await (await fetch('/api/effects')).json();allEffects.forEach(e=>effById.set(e.id,e));
  (await (await fetch('/api/items')).json()).forEach(i=>items.set(i.gid,i));if(items.size)selItem=[...items.keys()][0];renderItems();
  setStatus(await (await fetch('/api/status')).json());
  (await (await fetch('/api/packets')).json()).forEach(addPacket);render();
  const es=new EventSource('/events');
  es.addEventListener('packet',e=>{addPacket(JSON.parse(e.data));schedule()});
  es.addEventListener('item',e=>putItem(JSON.parse(e.data)));
  es.addEventListener('items_cleared',()=>{items.clear();selItem=null;renderItems()});
  es.addEventListener('status',e=>setStatus(JSON.parse(e.data)));
  setInterval(async()=>setStatus(await (await fetch('/api/status')).json()),3000);
})();
</script>
</body>
