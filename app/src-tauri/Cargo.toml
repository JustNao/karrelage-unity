[package]
name = "loutil-app"
version.workspace = true
edition.workspace = true
description = "Karrelage: passive Dofus 3 packet reader"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow.workspace = true
serde_json.workspace = true
parking_lot = "0.12"
loutil-core = { path = "../../crates/core" }
loutil-data = { path = "../../crates/data" }
loutil-proto = { path = "../../crates/proto" }
loutil-modules = { path = "../../crates/modules" }

[target.'cfg(windows)'.dependencies]
# SetWindowPos: move + resize a floating window in one step (already in the tree through tauri)
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
