<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Karrelage</title>
    <!-- frameless transparent window shown at startup; progress comes from the main window (src/main.ts) -->
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      img { width: 128px; height: 128px; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35)); animation: in 0.35s ease-out both; }
      .bar { width: 160px; height: 5px; border-radius: 3px; background: rgba(42, 46, 56, 0.85); overflow: hidden; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
      .fill { width: 4%; height: 100%; border-radius: 3px; background: #5aa9ff; transition: width 0.3s ease-out; }
      @keyframes in { from { opacity: 0; transform: scale(0.92); } }
    </style>
  </head>
  <body>
    <img src="/logo.png" alt="Karrelage" draggable="false" />
    <div class="bar"><div class="fill"></div></div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
