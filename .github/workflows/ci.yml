name: CI

on:
  push:
    branches: [master, restructure]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # the golden tests need the data pack (gitignored); the committed dist/ holds it
      - name: Unpack the data pack
        shell: pwsh
        run: Expand-Archive dist/datapack.zip datapack -Force
      - run: cargo test --workspace
      - name: Type-check the UI
        working-directory: app
        run: |
          npm ci
          npm run check
