[package]
name = "loutil-modules"
version.workspace = true
edition.workspace = true
description = "Feature modules (packets inspector, auction house) and the hub that dispatches decoded messages to them"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot = "0.12"
loutil-core = { path = "../core" }
loutil-data = { path = "../data" }
loutil-proto = { path = "../proto" }
ureq = "2"
sha2 = "0.11.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# game_focused (sys.rs): the foreground window's process (already in the tree through tauri)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
